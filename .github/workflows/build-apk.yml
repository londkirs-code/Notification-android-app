name: Build Notification Android App APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: notification-android-apk-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          for required in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Required Android project file missing: $required"
              exit 1
            fi
          done
          if [[ ! -f gradlew ]]; then
            echo "::notice::No Gradle wrapper script found; using pinned Gradle distribution."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android SDK tools safely
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager was not found under $SDK_ROOT/cmdline-tools. Available SDK paths:"
            find /usr/local/lib/android /opt -type f -name sdkmanager -print 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install the project's required Android SDK platform
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          set -euo pipefail
          # Rebuild verification: install the project's Android API 36 SDK platform.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create CI debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s debug.keystore

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --info assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build reported success but APK is missing or empty: $APK"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notification-android-app-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
