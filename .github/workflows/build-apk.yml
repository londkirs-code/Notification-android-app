# Rebuild requested on 2026-10-26 21:55 +0200 to package the latest NotifyKing features; keep this workflow triggered by app and build configuration changes.
name: Build Notification Android App APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: notification-android-apk-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          for required in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Required Android project file missing: $required"
              exit 1
            fi
          done
          if [[ ! -f gradlew ]]; then
            echo "::notice::No Gradle wrapper script found; using pinned Gradle distribution."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android SDK tools safely
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager was not found under $SDK_ROOT/cmdline-tools. Available SDK paths:"
            find /usr/local/lib/android /opt -type f -name sdkmanager -print 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install the project's required Android SDK platform
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create CI debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s debug.keystore

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --info assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build reported success but APK is missing or empty: $APK"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          cp "$APK" NotifyKing.apk
          cp app/build/outputs/apk/debug/SHA256SUMS.txt NotifyKing-SHA256SUMS.txt

      - name: Publish standalone APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NotifyKing build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            NotifyKing.apk
            NotifyKing-SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-android-app-apk
          path: |
            NotifyKing.apk
            NotifyKing-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Sync and overwrite NotifyKing.apk on Google Drive
        shell: bash
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_CREDENTIALS_DATA:-}" || -z "${GDRIVE_FOLDER_ID:-}" ]]; then
            echo "::notice::Google Drive secrets (GDRIVE_CREDENTIALS_DATA and GDRIVE_FOLDER_ID) not configured. Skipping Drive update."
            exit 0
          fi

          python3 -m pip install --upgrade google-api-python-client google-auth --quiet

          python3 - << 'EOF'
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_data = os.environ.get("GDRIVE_CREDENTIALS_DATA")
          folder_id = os.environ.get("GDRIVE_FOLDER_ID")
          apk_path = "NotifyKing.apk"
          filename = "NotifyKing.apk"

          if not creds_data or not folder_id:
              print("Credentials or folder ID missing.")
              exit(0)

          info = json.loads(creds_data)
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=credentials)

          query = f"'{folder_id}' in parents and name = '{filename}' and trashed = false"
          results = service.files().list(q=query, spaces='drive', fields='files(id, name)').execute()
          files = results.get('files', [])

          media = MediaFileUpload(apk_path, mimetype='application/vnd.android.package-archive', resumable=True)

          if files:
              file_id = files[0]['id']
              print(f"Updating existing file ID {file_id} with latest {filename}...")
              updated_file = service.files().update(
                  fileId=file_id,
                  media_body=media
              ).execute()
              print(f"File updated successfully! File ID: {updated_file.get('id')}")
          else:
              print(f"File {filename} does not exist in folder. Uploading new file...")
              file_metadata = {
                  'name': filename,
                  'parents': [folder_id]
              }
              new_file = service.files().create(
                  body=file_metadata,
                  media_body=media,
                  fields='id'
              ).execute()
              print(f"File uploaded successfully! File ID: {new_file.get('id')}")
          EOF
