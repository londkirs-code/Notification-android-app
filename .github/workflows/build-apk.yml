name: Build Notification Android App APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: notification-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          for required in settings.gradle.kts build.gradle.kts app/build.gradle.kts; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Required Android project file missing: $required"
              exit 1
            fi
          done
          if [[ ! -f gradlew ]]; then
            echo "::notice::No Gradle wrapper script found; using pinned Gradle distribution."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build reported success but APK is missing or empty: $APK"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notification-android-app-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
